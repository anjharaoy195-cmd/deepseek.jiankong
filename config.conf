# ============================================================
# DeepSeek 余额监控 · 配置文件
# 安装后路径: /data/adb/modules/deepseek_balance/config.conf
# 修改后执行: su -c sh /data/adb/modules/deepseek_balance/core.sh check
# ============================================================

# ---- 必填 ----
# DeepSeek API Key（sk- 开头，多个用英文逗号分隔，可带空格）
DEEPSEEK_KEYS=""

# ---- 显示与阈值 ----
# 显示币种: CNY / USD / 留空=全部
CURRENCY_FILTER="CNY"

# WebUI 是否显示币种选择: 1=显示 0=隐藏（默认隐藏，可在配置文件开启）
SHOW_CURRENCY_FILTER=0

# 余额低于此值 -> 悬浮通知（警告）
WARN_THRESHOLD=20

# 余额低于此值 -> 强提醒 + 震动（严重）
CRITICAL_THRESHOLD=5

# ---- 行为 ----
# 轮询间隔（秒），默认 1800 = 30 分钟
CHECK_INTERVAL=1800

# 余额回升是否也通知: 1=通知 0=不通知
NOTIFY_ON_RECOVER=1

# 常驻通知: 0=不常驻 1=常驻显示最新余额（推荐开启，缓解通知被系统清理）
ONGOING_NOTIFICATION=1

# 通知重发间隔（秒）：常驻通知被系统清理后，按此频率自动补发，默认 60
NOTIFY_INTERVAL=60

# 日志文件最大大小（KB），超出自动轮转
LOG_MAX_KB=512